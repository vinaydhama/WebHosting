<!doctype html>
<html lang="en">
  <script type="module" src="../../../js/PDFViewer.js" defer></script>

<head>
  <meta charset="utf-8" />
  <title>Firebase Files Viewer (Images + PDFs)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; }
    .card { max-width: 900px; border: 1px solid #ddd; border-radius: 12px; padding: 1.25rem; }
    .row { margin: 0.75rem 0; }
    label { display: block; margin-bottom: 0.25rem; }
    select, button { padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid #ccc; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { color: #666; font-size: 0.95rem; }
    .error { color: #b00020; }
    .success { color: #0a7a1b; }
    #viewer { margin-top: 1rem; border: 1px solid #ddd; border-radius: 8px; min-height: 360px; display: flex; align-items: center; justify-content: center; background: #fafafa; }
    #viewer img { max-width: 100%; max-height: 70vh; object-fit: contain; }
    #viewer iframe { width: 100%; height: 70vh; border: none; }
    .flex { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    .right { margin-left: auto; }
    code { background: #f4f4f4; padding: 0.1rem 0.3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Firebase File Dropdown & Viewer</h1>
  <div class="card">
    <div class="row">
      <div class="flex">
        <div>
          <label for="fileSelect"><strong>Available files</strong></label>
          <select id="fileSelect" disabled>
            <option value="">Loading files...</option>
          </select>
        </div>
        <button id="btnRefresh" class="right">Refresh list</button>
      </div>
      <div id="status" class="muted">Signing in (anonymous)…</div>
      <div class="muted">Folder: <code id="folderPathLabel"></code></div>
    </div>

    <div id="viewer">
      <div class="muted">Select a file from the dropdown to preview.</div>
    </div>

    <div id="linkWrap" class="row"></div>
  </div>

  
</body>
</html>
